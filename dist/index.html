<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="私密的房源记录与客户分析工具，数据仅保存在本机浏览器中。">
    <link rel="manifest" href="./manifest.json">
    <title>房源记录与客户分析</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f7f6; color: #173530; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .entry-app { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px calc(152px + env(safe-area-inset-bottom)); }
      .entry-header { margin: 4px 4px 18px; }
      .entry-header h1 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: .02em; }
      .entry-header p { margin: 7px 0 0; color: #647a74; font-size: 13px; }
      .entry-form, .analysis-card { background: #fff; border: 1px solid #dce9e5; border-radius: 18px; box-shadow: 0 4px 18px rgba(18, 76, 64, .06); }
      .entry-form { padding: 16px; }
      .form-section + .form-section { border-top: 1px solid #ebf1ef; margin-top: 19px; padding-top: 18px; }
      .section-title { margin: 0 0 12px; font-size: 16px; }
      .field-grid { display: grid; gap: 12px; }
      .field-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field { display: grid; gap: 6px; }
      .field.full { grid-column: 1 / -1; }
      label { color: #38544d; font-size: 13px; font-weight: 650; }
      .required { color: #d95b50; margin-left: 2px; }
      input, select, textarea { width: 100%; min-height: 46px; border: 1px solid #cbded8; border-radius: 11px; background: #fff; padding: 10px 11px; color: #173530; outline: none; }
      textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
      input:focus, select:focus, textarea:focus { border-color: #0f897b; box-shadow: 0 0 0 3px rgba(15, 137, 123, .13); }
      .media-actions { display: flex; gap: 10px; }
      .media-actions button { flex: 1; min-height: 46px; border-radius: 12px; border: 1px dashed #70aa9f; background: #f1faf7; color: #086c60; font-weight: 700; }
      .media-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
      .media-card { position: relative; overflow: hidden; aspect-ratio: 4 / 3; border: 1px solid #d8e7e2; border-radius: 12px; background: #e8f0ee; }
      .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .remove-media { position: absolute; top: 7px; right: 7px; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: rgba(20, 43, 38, .78); color: #fff; font-size: 20px; line-height: 1; }
      .hint { margin: 9px 0 0; color: #6a817a; font-size: 12px; line-height: 1.55; }
      .analysis-card { margin-top: 16px; padding: 15px; border-color: #9bcfc4; background: linear-gradient(145deg, #f1fbf8, #fff); }
      .analysis-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .analysis-head h2 { margin: 0; font-size: 17px; }
      .score { display: grid; place-items: center; width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%; background: #0f766e; color: #fff; font-weight: 800; font-size: 18px; }
      .analysis-card p { margin: 12px 0 0; font-size: 14px; line-height: 1.6; }
      .analysis-card strong { color: #0b665b; }
      .analysis-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
      .analysis-tags span { background: #d8f0e9; color: #086c60; padding: 5px 9px; border-radius: 999px; font-size: 12px; }
      .score-detail { margin: 12px 0 0; color: #607871; font-size: 12px; }
      .form-error, .form-success { margin: 14px 1px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
      .form-error { background: #fff0ed; color: #a83d31; }
      .form-success { background: #e6f7ef; color: #166b4a; }
      .sticky-actions { position: fixed; z-index: 5; right: 0; bottom: 62px; left: 0; display: flex; gap: 10px; padding: 12px 16px; background: rgba(243,247,246,.94); backdrop-filter: blur(10px); border-top: 1px solid #dce9e5; }
      .sticky-actions button { min-height: 48px; border-radius: 13px; font-weight: 750; }
      .analyse-button { flex: .9; border: 1px solid #58a99b; background: #fff; color: #087365; }
      .save-button { flex: 1.1; border: 0; background: #0f766e; color: #fff; box-shadow: 0 5px 12px rgba(15,118,110,.2); }
      .save-button:disabled { opacity: .58; cursor: wait; }
      .app-topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 4px 18px; }
      .app-topbar h1 { margin:0; font-size:23px; }
      .icon-button, .text-button { border:1px solid #bcd8d1; background:#fff; color:#086c60; min-height:40px; padding:0 12px; border-radius:11px; font-weight:700; }
      .tabbar { position:fixed; z-index:8; bottom:0; left:0; right:0; display:flex; background:rgba(255,255,255,.97); border-top:1px solid #dce9e5; padding:8px 16px max(8px, env(safe-area-inset-bottom)); }
      .tabbar button { flex:1; border:0; background:transparent; padding:8px; color:#668078; font-size:13px; font-weight:700; }
      .tabbar button.active { color:#087365; }
      .list-page, .detail-page, .settings-page { min-height:100vh; padding:max(16px, env(safe-area-inset-top)) 16px calc(82px + env(safe-area-inset-bottom)); }
      .filter-panel, .listing-card, .detail-card, .settings-card { background:#fff; border:1px solid #dce9e5; border-radius:17px; box-shadow:0 4px 18px rgba(18,76,64,.06); }
      .filter-panel { padding:14px; display:grid; gap:10px; }
      .filter-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .rent-row { display:flex; align-items:center; gap:7px; } .rent-row input { min-width:0; }
      .listing-list { display:grid; gap:12px; margin-top:15px; }
      .listing-card { width:100%; text-align:left; padding:15px; color:inherit; }
      .listing-card h2 { margin:0; font-size:17px; } .listing-meta { margin:8px 0 0; display:flex; flex-wrap:wrap; gap:7px; color:#547069; font-size:13px; }
      .chip { display:inline-block; padding:4px 8px; border-radius:999px; background:#e7f5f0; color:#087365; font-size:12px; }
      .empty-state { text-align:center; padding:42px 18px; color:#668078; }
      .detail-card, .settings-card { padding:16px; } .detail-card + .detail-card { margin-top:13px; }
      .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      .detail-item { padding:10px; border-radius:11px; background:#f4f9f7; } .detail-item dt { font-size:12px; color:#6b817a; } .detail-item dd { margin:5px 0 0; font-size:14px; word-break:break-word; }
      .detail-text { white-space:pre-wrap; line-height:1.6; margin:7px 0 0; }
      .detail-media { margin-top:12px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .detail-media img,.detail-media video { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border-radius:11px; background:#e8f0ee; }
      .primary-button { min-height:46px; border:0; border-radius:12px; padding:0 15px; background:#0f766e; color:#fff; font-weight:750; } .secondary-button { min-height:46px; border:1px solid #58a99b; border-radius:12px; padding:0 15px; background:#fff; color:#087365; font-weight:750; }
      .button-row { display:flex; gap:10px; flex-wrap:wrap; } .button-row > * { flex:1; }
      .modal-backdrop { position:fixed; z-index:20; inset:0; display:grid; align-items:end; background:rgba(13,33,29,.48); }
      .modal { width:100%; max-height:88vh; padding:16px; border-radius:22px 22px 0 0; overflow:auto; background:#fff; }
      #amap-container { width:100%; height:55vh; min-height:300px; margin-top:12px; border-radius:13px; overflow:hidden; background:#edf4f2; }
      /* 黑白主题：仅覆盖视觉层，不影响任何业务行为。 */
      :root { --mono-ink:#111; --mono-muted:#666; --mono-line:#d4d4d4; --mono-soft:#f4f4f4; --mono-paper:#fff; }
      body, .entry-app { color:var(--mono-ink); background:var(--mono-soft); }
      .entry-form, .analysis-card, .filter-panel, .listing-card, .detail-card, .settings-card, .modal { background:var(--mono-paper); border-color:var(--mono-line); box-shadow:none; }
      .form-section + .form-section, .sticky-actions, .tabbar { border-color:var(--mono-line); }
      label, .hint, .score-detail, .listing-meta, .empty-state, .detail-item dt, .tabbar button { color:var(--mono-muted); }
      input, select, textarea { color:var(--mono-ink); border-color:#bdbdbd; background:var(--mono-paper); }
      input:focus, select:focus, textarea:focus { border-color:var(--mono-ink); box-shadow:0 0 0 3px rgba(0,0,0,.12); }
      .media-actions button, .analyse-button, .secondary-button, .icon-button, .text-button { color:var(--mono-ink); border-color:var(--mono-ink); background:var(--mono-paper); }
      .media-card, .detail-item, .detail-media img, .detail-media video, #amap-container { background:#e9e9e9; border-color:var(--mono-line); }
      .analysis-card { background:var(--mono-paper); } .analysis-card strong { color:var(--mono-ink); }
      .score, .save-button, .primary-button { background:var(--mono-ink); color:var(--mono-paper); box-shadow:none; }
      .analysis-tags span, .chip { background:#e8e8e8; color:var(--mono-ink); }
      .remove-media, .modal-backdrop { background:rgba(0,0,0,.78); }
      .form-error { background:#f1f1f1; color:var(--mono-ink); border:1px solid #aaa; }
      .form-success { background:#ebebeb; color:var(--mono-ink); border:1px solid #aaa; }
      .tabbar button.active { color:var(--mono-ink); text-decoration:underline; text-underline-offset:4px; }
      @media (min-width: 620px) { .entry-app { max-width: 620px; margin: 0 auto; } }
    </style>
  </head>
  <body>
    <!-- Vue 应用将在后续任务挂载到这里。 -->
    <div id="app"></div>

    <!-- Vue 仅用于界面层；房源数据始终留在本机 IndexedDB。 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- 浏览器端仅加载 Supabase 的公开客户端；访问控制由数据库 RLS 负责。 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // 更新缓存时同步更新此版本号，便于后续维护。
      window.__APP_VERSION__ = '1.1.0';

      // PWA 仅在安全上下文（HTTPS 或 localhost）中可以注册 Service Worker。
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('Service Worker 注册失败：', error);
          });
        });
      }

      // 浏览器控制台最小烟雾检查：保证应用挂载点和主题色元数据存在。
      console.assert(document.querySelector('#app'), 'app mount point is missing');
      console.assert(document.querySelector('meta[name="theme-color"]'), 'theme color is missing');

      /**
       * 房源规范对象。媒体 Blob 不嵌入 listings 表，而是由 mediaIds 引用，
       * 避免每次更新文字字段时复制大文件。
       */
      const LISTING_FIELDS = Object.freeze([
        'communityName', 'address', 'area', 'layout', 'rent', 'floor',
        'orientation', 'decoration', 'ownerBottomPrice', 'advantages',
        'disadvantages', 'notes'
      ]);

      function createId() {
        return globalThis.crypto?.randomUUID?.()
          || `listing-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeListing(input = {}) {
        const listing = {
          id: String(input.id || createId()),
          communityName: String(input.communityName || '').trim(),
          address: String(input.address || '').trim(),
          area: Number(input.area) || 0,
          layout: String(input.layout || '').trim(),
          rent: Number(input.rent) || 0,
          floor: String(input.floor || '').trim(),
          orientation: String(input.orientation || '').trim(),
          decoration: String(input.decoration || '').trim(),
          ownerBottomPrice: Number(input.ownerBottomPrice) || 0,
          advantages: String(input.advantages || '').trim(),
          disadvantages: String(input.disadvantages || '').trim(),
          notes: String(input.notes || '').trim(),
          analysis: input.analysis && typeof input.analysis === 'object'
            ? structuredClone(input.analysis) : null,
          mediaIds: Array.isArray(input.mediaIds)
            ? input.mediaIds.map(String) : [],
          createdAt: input.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        return listing;
      }

      function statedFloorScore(floor) {
        const values = String(floor || '').match(/\d+(?:\.\d+)?/g);
        if (!values?.length) return { points: 0, label: '楼层未填写：+0' };
        const current = Number(values[0]);
        const total = Number(values[1]);
        const isMiddle = total > 0
          ? current / total >= 1 / 3 && current / total <= 2 / 3
          : false;
        return isMiddle
          ? { points: 8, label: '中间楼层：+8' }
          : { points: 4, label: '已填写其他楼层：+4' };
      }

      /**
       * 纯函数：可在保存前反复调用。评分从 45 分开始，每个分项均返回，
       * 让中介可以清楚理解最终得分的来源。
       */
      function analyzeListing(listing = {}) {
        const decoration = String(listing.decoration || '').trim();
        const orientation = String(listing.orientation || '').trim();
        const address = String(listing.address || '');
        const area = Number(listing.area) || 0;
        const hasArea = area > 0;
        const clients = [];
        const scoreDetails = [{ label: '基础分', points: 45 }];
        const decorationPoints = { '精装': 20, '简装': 10, '老旧': 2 }[decoration] || 0;
        scoreDetails.push({ label: `装修（${decoration || '未填写'}）`, points: decorationPoints });

        const orientationPoints = (orientation === '南' || orientation === '东南') ? 15 : 0;
        scoreDetails.push({ label: `朝向（${orientation || '未填写'}）`, points: orientationPoints });

        const floor = statedFloorScore(listing.floor);
        scoreDetails.push(floor);

        const areaPoints = hasArea ? (area >= 40 && area <= 90 ? 8 : 4) : 0;
        scoreDetails.push({ label: `面积（${area || '未填写'}㎡）`, points: areaPoints });

        if (decoration === '精装' && (orientation === '南' || orientation === '东南')) {
          clients.push('追求品质的白领/情侣');
        }
        if (decoration === '简装' && hasArea && area < 40) {
          clients.push('预算有限的毕业生/单身人士');
        }
        if (decoration === '老旧' && area > 70) {
          clients.push('想低价改造的年轻家庭/投资客');
        }
        if (!clients.length) clients.push('需求明确的租客');

        const areaNote = /石厦|益田/.test(address)
          ? '石厦片区，适合福田CBD上班族/陪读家庭'
          : '';
        const score = Math.max(0, Math.min(100,
          scoreDetails.reduce((sum, item) => sum + item.points, 0)));
        const highlights = [];
        if (decoration === '精装') highlights.push('精装省心入住');
        if (orientation === '南' || orientation === '东南') highlights.push('采光朝向佳');
        if (area > 0) highlights.push(`${area}㎡空间利用灵活`);
        const advice = `${highlights.length ? highlights.join('，') : '按客户实际需求灵活推荐'}，重点推荐给${clients[0]}。`;

        return { score, clients, advice, areaNote, scoreDetails };
      }

      /** IndexedDB 仓库：不含网络请求，所有图片/视频 Blob 均只保存在本机。 */
      const db = (() => {
        const DB_NAME = 'property-record-local';
        const DB_VERSION = 1;
        let databasePromise;

        function open() {
          if (databasePromise) return databasePromise;
          databasePromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = () => {
              const database = request.result;
              if (!database.objectStoreNames.contains('listings')) {
                database.createObjectStore('listings', { keyPath: 'id' });
              }
              if (!database.objectStoreNames.contains('media')) {
                const media = database.createObjectStore('media', { keyPath: 'id' });
                media.createIndex('listingId', 'listingId', { unique: false });
              }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('无法打开本地数据库'));
          });
          return databasePromise;
        }

        async function run(storeNames, mode, operation) {
          const database = await open();
          return new Promise((resolve, reject) => {
            const transaction = database.transaction(storeNames, mode);
            const result = operation(transaction);
            transaction.oncomplete = () => resolve(result);
            transaction.onerror = () => reject(transaction.error || new Error('本地数据库操作失败'));
            transaction.onabort = () => reject(transaction.error || new Error('本地数据库操作已取消'));
          });
        }

        return {
          async saveListing(input) {
            const listing = normalizeListing(input);
            const incomingMedia = Array.isArray(input.media) ? input.media : [];
            const mediaRecords = incomingMedia.map((item) => ({
              id: String(item.id || createId()), listingId: listing.id,
              kind: item.kind === 'video' ? 'video' : 'image',
              name: String(item.name || ''), type: String(item.type || ''), blob: item.blob
            }));
            if (mediaRecords.some((item) => !(item.blob instanceof Blob))) {
              throw new TypeError('媒体记录必须包含本地 Blob');
            }
            listing.mediaIds = [...new Set([...listing.mediaIds, ...mediaRecords.map((item) => item.id)])];
            await run(['listings', 'media'], 'readwrite', (tx) => {
              tx.objectStore('listings').put(listing);
              mediaRecords.forEach((record) => tx.objectStore('media').put(record));
            });
            return structuredClone(listing);
          },
          async listListings() {
            const database = await open();
            return new Promise((resolve, reject) => {
              const request = database.transaction('listings', 'readonly').objectStore('listings').getAll();
              request.onsuccess = () => resolve(request.result.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)));
              request.onerror = () => reject(request.error || new Error('读取房源列表失败'));
            });
          },
          async getListing(id) {
            const database = await open();
            return new Promise((resolve, reject) => {
              const tx = database.transaction(['listings', 'media'], 'readonly');
              const listingRequest = tx.objectStore('listings').get(String(id));
              listingRequest.onerror = () => reject(listingRequest.error || new Error('读取房源失败'));
              listingRequest.onsuccess = () => {
                const listing = listingRequest.result;
                if (!listing) return resolve(null);
                const mediaRequest = tx.objectStore('media').index('listingId').getAll(listing.id);
                mediaRequest.onsuccess = () => resolve({ ...listing, media: mediaRequest.result });
                mediaRequest.onerror = () => reject(mediaRequest.error || new Error('读取媒体失败'));
              };
            });
          },
          async listMedia() {
            const database = await open();
            return new Promise((resolve, reject) => {
              const request = database.transaction('media', 'readonly').objectStore('media').getAll();
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error || new Error('读取媒体失败'));
            });
          },
          async deleteListing(id) {
            const listingId = String(id);
            await run(['listings', 'media'], 'readwrite', (tx) => {
              tx.objectStore('listings').delete(listingId);
              const index = tx.objectStore('media').index('listingId');
              const cursor = index.openCursor(IDBKeyRange.only(listingId));
              cursor.onsuccess = () => {
                const current = cursor.result;
                if (current) { current.delete(); current.continue(); }
              };
            });
          }
        };
      })();

      // Expose the deliberately small data-layer API for later Vue components and manual diagnostics.
      window.analyzeListing = analyzeListing;
      window.db = db;
      window.createEmptyListing = () => normalizeListing({});
      window.Vue = window.Vue;

      /** 团队协作客户端：配置只保存在当前浏览器，用户可随时退出或清除浏览器数据。 */
      const TEAM_CONFIG_KEY = 'property-team-supabase-config';
      let activeSupabaseClient = null;

      function getTeamConfig() {
        try { return JSON.parse(localStorage.getItem(TEAM_CONFIG_KEY) || '{}'); }
        catch (_) { return {}; }
      }

      function saveTeamConfig(url, anonKey) {
        const config = { url: String(url || '').trim().replace(/\/$/, ''), anonKey: String(anonKey || '').trim() };
        if (!/^https:\/\//.test(config.url) || !config.anonKey) throw new Error('请填写有效的项目地址和公开客户端标识。');
        localStorage.setItem(TEAM_CONFIG_KEY, JSON.stringify(config));
        activeSupabaseClient = window.supabase.createClient(config.url, config.anonKey);
        return activeSupabaseClient;
      }

      function getSupabaseClient() {
        if (activeSupabaseClient) return activeSupabaseClient;
        const config = getTeamConfig();
        if (!config.url || !config.anonKey || !window.supabase?.createClient) return null;
        activeSupabaseClient = window.supabase.createClient(config.url, config.anonKey);
        return activeSupabaseClient;
      }

      function pendingInviteCode() {
        return new URLSearchParams(location.search).get('invite')?.trim() || '';
      }

      async function signInWithEmail(email) {
        const client = getSupabaseClient();
        if (!client) throw new Error('请先保存 Supabase 项目配置。');
        const cleanEmail = String(email || '').trim();
        if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) throw new Error('请输入有效邮箱地址。');
        const invite = pendingInviteCode();
        const redirectTo = `${location.origin}${location.pathname}${invite ? `?invite=${encodeURIComponent(invite)}` : ''}`;
        const { error } = await client.auth.signInWithOtp({ email: cleanEmail, options: { emailRedirectTo: redirectTo } });
        if (error) throw error;
      }

      async function createTeam(name) {
        const client = getSupabaseClient();
        if (!client) throw new Error('请先保存 Supabase 项目配置。');
        const { data, error } = await client.rpc('create_team', { team_name: String(name || '').trim() });
        if (error) throw error;
        return data;
      }

      async function joinTeamFromInvite(code = pendingInviteCode()) {
        const client = getSupabaseClient();
        if (!client) throw new Error('请先保存 Supabase 项目配置。');

      function propertyMediaPath(teamId, propertyId, mediaId) {
        return `teams/${teamId}/properties/${propertyId}/${mediaId}`;
      }

      async function signedMediaUrl(path) {
        const client = getSupabaseClient();
        if (!client || !path) return '';
        const { data, error } = await client.storage.from('property-media').createSignedUrl(path, 60 * 30);
        if (error) throw error;
        return data?.signedUrl || '';
      }

      async function syncProperty(listing, teamId) {
        const client = getSupabaseClient();
        if (!client || !teamId) throw new Error('请先登录并选择团队。');
        const media = Array.isArray(listing.media) ? listing.media : [];
        const cloudMedia = [];
        for (const item of media) {
          const path = propertyMediaPath(teamId, listing.id, item.id);
          if (item.blob instanceof Blob) {
            const { error } = await client.storage.from('property-media').upload(path, item.blob, {
              contentType: item.type || item.blob.type || undefined, upsert: true
            });
            if (error) throw error;
          }
          cloudMedia.push({ id: item.id, kind: item.kind, name: item.name || '', type: item.type || '', path });
        }
        const { media: _media, ...payload } = listing;
        const { error } = await client.from('properties').upsert({ id: listing.id, team_id: teamId, payload: { ...payload, cloudMedia } });
        if (error) throw error;
      }

        if (error) throw error;
        return Promise.all((data || []).map(async (row) => {
          const payload = row.payload || {};
          const media = await Promise.all((payload.cloudMedia || []).map(async (item) => ({ ...item, previewUrl: await signedMediaUrl(item.path) })));
          return { ...payload, id: row.id, teamId: row.team_id, updatedAt: row.updated_at, media };
        }));
      }

          const { error: storageError } = await client.storage.from('property-media').remove(paths);
          if (storageError) throw storageError;

        const { error } = await client.from('properties').delete().eq('id', propertyId).eq('team_id', teamId);
        if (error) throw error;

              const [allListings, media] = await Promise.all([db.listListings(), db.listMedia()]);
              const exportedMedia = await Promise.all(media.map(async (item) => ({ id:item.id, listingId:item.listingId, kind:item.kind, name:item.name, type:item.type, dataUrl:await blobToDataUrl(item.blob) })));
              const payload = { format: 'property-record-backup', version: 1, exportedAt: new Date().toISOString(), listings: allListings, media: exportedMedia };
              const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' }));
              const link = document.createElement('a'); link.href = url; link.download = `房源备份-${new Date().toISOString().slice(0,10)}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
              notice.value = `已导出 ${allListings.length} 套房源（含本地媒体）。`;
            } catch (error) { console.error(error); notice.value = '导出失败：请确认浏览器仍有足够本地存储空间。'; }
          }
          onMounted(() => { if (getSupabaseClient()) refreshTeamState().catch((error) => { teamError.value = error.message || '读取团队状态失败。'; }); });
          onBeforeUnmount(() => { mediaUrls.forEach((url) => URL.revokeObjectURL(url)); if (mapInstance) mapInstance.destroy(); if (realtimeChannel) getSupabaseClient()?.removeChannel(realtimeChannel); });
          refreshListings();
          return { page, listings, selected, filters, loading, notice, amapKey, mapOpen, filteredListings, layouts, changePage, showDetail, refreshListings, saveAmapKey, openMap, closeMap, exportAll, mediaUrl, downloadMedia, getSupabaseClient, teamConfig, loginEmail, newTeamName, session, teams, activeTeam, teamBusy, teamMessage, teamError, pendingInviteCode, inviteLink, saveTeamConnection, requestEmailLogin, makeTeam, joinPendingInvite, renewInvite, copyInvite, handleListingSaved, removeSelectedTeamProperty };
        },

            <p v-if="notice" class="form-success" role="status">{{ notice }}</p><section v-if="filteredListings.length" class="listing-list"><button v-for="item in filteredListings" :key="item.id" class="listing-card" @click="showDetail(item.id)"><h2>{{ item.communityName }}</h2><div class="listing-meta"><span>{{ item.layout || '户型未填' }}</span><strong>¥{{ Number(item.rent || 0).toLocaleString() }}/月</strong><span class="chip">{{ item.decoration || '装修未填' }}</span></div><div v-if="item.analysis?.clients?.length" class="listing-meta"><span class="chip">{{ item.analysis.clients.join('、') }}</span></div></button></section><div v-else class="empty-state">{{ loading ? '正在读取本机数据…' : '暂无匹配房源，去录入第一套吧。' }}</div>
          </main>
          <main v-else-if="page === 'detail'" class="detail-page"><header class="app-topbar"><button class="icon-button" @click="changePage('list')">‹ 返回</button><h1>房源详情</h1><span></span></header><template v-if="selected"><section class="detail-card"><h2 style="margin:0">{{ selected.communityName }}</h2><p class="hint">{{ selected.address || '未填写具体地址' }}</p><dl class="detail-grid"><div class="detail-item"><dt>户型</dt><dd>{{ selected.layout || '—' }}</dd></div><div class="detail-item"><dt>租金</dt><dd>¥{{ Number(selected.rent || 0).toLocaleString() }}/月</dd></div><div class="detail-item"><dt>面积</dt><dd>{{ selected.area || '—' }}㎡</dd></div><div class="detail-item"><dt>楼层 / 朝向</dt><dd>{{ selected.floor || '—' }} / {{ selected.orientation || '—' }}</dd></div><div class="detail-item"><dt>装修</dt><dd>{{ selected.decoration || '—' }}</dd></div><div class="detail-item"><dt>业主心理底价</dt><dd>{{ selected.ownerBottomPrice ? '¥' + Number(selected.ownerBottomPrice).toLocaleString() : '—' }}</dd></div></dl><div class="button-row" style="margin-top:14px"><button class="primary-button" @click="openMap">查看位置</button><button v-if="activeTeam" class="secondary-button" @click="removeSelectedTeamProperty">删除团队房源</button></div></section><section v-if="selected.analysis" class="detail-card"><h2 class="section-title">智能分析</h2><p><strong>综合评分：{{ selected.analysis.score }} 分</strong></p><p class="detail-text">推荐客户：{{ selected.analysis.clients?.join('、') || '—' }}</p><p v-if="selected.analysis.areaNote" class="detail-text">片区提示：{{ selected.analysis.areaNote }}</p><p class="detail-text">一句话卖点：{{ selected.analysis.advice }}</p></section><section class="detail-card"><h2 class="section-title">房源判断</h2><p class="detail-text"><strong>卖点：</strong>{{ selected.advantages || '—' }}</p><p class="detail-text"><strong>缺点：</strong>{{ selected.disadvantages || '—' }}</p><p class="detail-text"><strong>备注：</strong>{{ selected.notes || '—' }}</p><div v-if="selected.media?.length" class="detail-media"><template v-for="item in selected.media" :key="item.id"><img v-if="item.kind === 'image'" :src="mediaUrl(item)" :alt="item.name || '房源照片'" /><video v-else :src="mediaUrl(item)" controls playsinline></video><button class="secondary-button media-download" type="button" @click="downloadMedia(item)">保存{{ item.kind === 'video' ? '视频' : '照片' }}</button></template></div></section></template></main>
          <main v-else class="settings-page"><header class="app-topbar"><h1>设置与备份</h1></header>
            <section class="settings-card"><h2 class="section-title">团队协作</h2><p class="hint">启用后，团队房源、照片和视频将保存到你自己的 Supabase 项目；仅登录并加入团队的成员可访问。</p>
              <div class="field"><label>项目地址</label><input v-model="teamConfig.url" inputmode="url" autocomplete="off" placeholder="https://xxxx.supabase.co" /></div>

              <template v-if="getSupabaseClient && session"><p class="form-success">已登录：{{ session.user.email }}</p><div v-if="pendingInviteCode()" class="button-row"><button class="secondary-button" :disabled="teamBusy" @click="joinPendingInvite">加入此邀请团队</button></div><div v-if="!activeTeam" class="field" style="margin-top:12px"><label>新团队名称</label><input v-model="newTeamName" placeholder="例如：福田租赁组" /><button class="primary-button" :disabled="teamBusy" style="margin-top:10px" @click="makeTeam">创建团队</button></div><template v-else><p class="detail-text"><strong>当前团队：</strong>{{ activeTeam.name }}</p><label>同事邀请链接</label><textarea readonly :value="inviteLink()" style="min-height:68px"></textarea><div class="button-row" style="margin-top:10px"><button class="secondary-button" @click="copyInvite">复制链接</button><button class="secondary-button" :disabled="teamBusy" @click="renewInvite">更新邀请链接</button></div><p class="hint">更新后，旧链接无法再加入；已加入的同事不受影响。</p></template></template>
              <template v-else><div class="field" style="margin-top:12px"><label>登录邮箱</label><input v-model="loginEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" /></div><div class="button-row" style="margin-top:10px"><button class="primary-button" :disabled="teamBusy" @click="requestEmailLogin">发送登录链接</button></div><p class="hint">先保存并连接，再用邮箱登录。请在同一浏览器打开邮件中的登录链接。</p></template>
              <p v-if="teamError" class="form-error" role="alert">{{ teamError }}</p><p v-if="teamMessage" class="form-success" role="status">{{ teamMessage }}</p>
            </section>
            <section class="settings-card" style="margin-top:14px"><h2 class="section-title">高德地图 Key</h2><label>Web 端 JS API Key</label><input v-model="amapKey" autocomplete="off" placeholder="粘贴您申请的高德地图 Key" /><p class="hint">Key 只保存于当前浏览器。未填 Key 时，详情页会打开高德公开搜索地图。</p><div class="button-row"><button class="primary-button" @click="saveAmapKey">保存 Key</button></div></section>
            <section class="settings-card" style="margin-top:14px"><h2 class="section-title">数据备份</h2><p class="hint">导出包含文字、照片和视频的 JSON 文件；视频较大时导出文件也会较大。</p><button class="secondary-button" @click="exportAll">导出全部房源 JSON</button><p v-if="notice" class="form-success" role="status">{{ notice }}</p></section>
          </main>
          <nav v-if="page !== 'detail'" class="tabbar" aria-label="主导航"><button :class="{active:page==='entry'}" @click="changePage('entry')">录入</button><button :class="{active:page==='list'}" @click="changePage('list')">房源列表</button><button :class="{active:page==='settings'}" @click="changePage('settings')">设置</button></nav>

        `

      Vue.createApp(PropertyToolApp).mount('#app');
